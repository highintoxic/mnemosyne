name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile check
        run: python -m compileall -q src

      - name: Run tests
        run: python -m pytest -q

      - name: CLI smoke test
        run: |
          mnemosyne init --vault /tmp/ci-vault
          mnemosyne save --vault /tmp/ci-vault --type semantic --title "CI memory" --body "Works."
          mnemosyne recall --vault /tmp/ci-vault "CI"
        shell: bash
