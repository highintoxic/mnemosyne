[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-memory"
version = "0.1.0"
description = "Local-first linked memory workspace for Obsidian and Claude Code"
requires-python = ">=3.11"

[project.scripts]
obsidian-memory = "obsidian_memory.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
